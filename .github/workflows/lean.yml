name: Lean build and axiom audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          build: true
          test: false
          lint: false

      - name: Forbidden tokens (sorry / admit / native_decide / custom axioms)
        run: |
          set -e
          if grep -rn --include='*.lean' -E '\bsorry\b|\badmit\b|native_decide|^[[:space:]]*axiom[[:space:]]' . --exclude-dir=.lake ; then
            echo "::error::forbidden token found"; exit 1
          fi
          echo "no forbidden tokens"

      - name: Axiom audit of main theorems
        run: |
          set -e
          cat > AxiomAudit.lean <<'EOF'
          import JSP000759
          import JSP000906
          import JSP000625
          #print axioms JSP000759.leonard_counterexample
          #print axioms JSP000906.catalog_statement
          #print axioms JSP000625.erdos_fuchs_bounded_error
          EOF
          lake env lean AxiomAudit.lean | tee axioms.txt
          # every line must list only the three standard axioms
          ! grep -v -E "depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$" axioms.txt | grep -q "depends on axioms"
          echo "axiom audit passed"

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: axiom-audit
          path: axioms.txt
